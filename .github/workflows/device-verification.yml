name: Device verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-file-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295 # v2
        with:
          channel: stable
          cache: true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create and boot emulator
        run: |
          sdkmanager 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd -n updater -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd updater -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
      - name: Verify FileProvider without installing an update
        working-directory: example
        run: flutter test integration_test/foreground_install_handoff_test.dart -d emulator-5554
  macos-network:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295 # v2
        with:
          channel: stable
          cache: true
      - name: Verify sandbox HTTPS transport
        working-directory: example
        run: flutter test integration_test/production_network_test.dart -d macos --dart-define=UPDATER_NETWORK_TEST_URL=https://example.com/
